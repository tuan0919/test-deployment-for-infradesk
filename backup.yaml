stages:
  - backup

variables:
  APP_GIT: git@github.com:tuan0919/test-deployment-for-infradesk.git
  APP_SRC: ./source
  DEPLOY_DIR: /home/gmo021/deploy-folder
  BACKUP_ROOT: /home/gmo021/deploy-folder/backups
  POSTGRES_USER: app
  POSTGRES_DB: app

backup_runtime:
  stage: backup
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: manual
      allow_failure: false
    - when: never
  before_script:
    - |
      set -eu
      rm -rf "$APP_SRC"
      mkdir -p "$APP_SRC" "$BACKUP_ROOT"
      git clone "$APP_GIT" "$APP_SRC"
      git -C "$APP_SRC" checkout --detach "$CI_COMMIT_SHA"
  script:
    - |
      set -eu
      cd "$APP_SRC/deploy"
      export DEPLOY_DIR BACKUP_ROOT POSTGRES_USER POSTGRES_DB IMAGE_TAG
      export BACKUP_ID="${BACKUP_ID:-}"
      chmod +x scripts/backup.sh
      ./scripts/backup.sh
