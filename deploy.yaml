stages:
  - build
  - test
  - deploy

variables:
  APP_GIT: git@github.com:tuan0919/test-deployment-for-infradesk.git
  REGISTRY: gmo021.cansportsvg.com:9443
  REGISTRY_USER: admin
  IMAGE_NAME: infradesk/test-deployment
  IMAGE_TAG: v2.0.0
  BUILD_DIR: ./build
  TEST_DIR: ./test
  PERFORMANCE_TEST_DIR: ./performance-test
  INTEGRATION_TEST_DIR: ./integration-test
  APP_SRC: ./source
  PUBLISH_PORT: "18080"
  DEPLOY_DIR: /home/gmo021/deploy-folder
  POSTGRES_USER: app
  POSTGRES_DB: app

build_image:
  stage: build
  tags: [gmo021-client]
  rules:
    - if: "$CI_COMMIT_TAG"
      when: on_success
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: on_success
    - when: never
  before_script:
    - |
      set -eu
      rm -rf "$BUILD_DIR"
      mkdir -p "$BUILD_DIR"
      git clone "$APP_GIT" "$BUILD_DIR"
      git -C "$BUILD_DIR" checkout --detach "$CI_COMMIT_SHA"
  script:
    - |
      set -eu
      test -n "${REGISTRY_PASSWORD:-}"
      echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
      docker build --build-arg APP_VERSION="$IMAGE_TAG" -t "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" "$BUILD_DIR"
      docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

unit_test:
  stage: test
  tags: [dell-server]
  rules:
    - if: "$CI_COMMIT_TAG"
      when: on_success
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: on_success
    - when: never
  before_script:
    - |
      set -eu
      rm -rf "$TEST_DIR"
      mkdir -p "$TEST_DIR"
      git clone "$APP_GIT" "$TEST_DIR"
      git -C "$TEST_DIR" checkout --detach "$CI_COMMIT_SHA"
  script:
    - |
      set -eu
      cd "$TEST_DIR"
      docker run --rm -v "$(pwd)":/app -w /app node:20-bookworm-slim sh -c "npm ci && npm test"

performance_test:
  stage: test
  tags: [gmo021-client]
  rules:
    - if: "$CI_COMMIT_TAG"
      when: on_success
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: on_success
    - when: never
  before_script:
    - |
      set -eu
      rm -rf "$PERFORMANCE_TEST_DIR"
      mkdir -p "$PERFORMANCE_TEST_DIR"
      git clone "$APP_GIT" "$PERFORMANCE_TEST_DIR"
      git -C "$PERFORMANCE_TEST_DIR" checkout --detach "$CI_COMMIT_SHA"
  script:
    - |
      set -eu
      cd "$PERFORMANCE_TEST_DIR"
      docker run --rm -v "$(pwd)":/app -w /app node:20-bookworm-slim node --input-type=module -e '
        import { resolveAppVersion } from "./src/version.js";
        const started = performance.now();
        for (let index = 0; index < 100000; index += 1) {
          if (resolveAppVersion({ APP_VERSION: "v2.0.0" }) !== "v2.0.0") process.exit(1);
        }
        console.log(`pseudo performance test passed in ${(performance.now() - started).toFixed(1)}ms`);
      '

integration_test:
  stage: test
  tags: [gmo021-client]
  rules:
    - if: "$CI_COMMIT_TAG"
      when: on_success
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: on_success
    - when: never
  before_script:
    - |
      set -eu
      rm -rf "$INTEGRATION_TEST_DIR"
      mkdir -p "$INTEGRATION_TEST_DIR"
      git clone "$APP_GIT" "$INTEGRATION_TEST_DIR"
      git -C "$INTEGRATION_TEST_DIR" checkout --detach "$CI_COMMIT_SHA"
  script:
    - |
      set -eu
      cd "$INTEGRATION_TEST_DIR"
      docker run --rm -v "$(pwd)":/app -w /app node:20-bookworm-slim node --input-type=module -e '
        import { resolveAppVersion, versionLabel } from "./src/version.js";
        const version = resolveAppVersion({ APP_VERSION: "v2.0.0" });
        if (versionLabel(version) !== "Phiên bản v2.0.0") process.exit(1);
        console.log("pseudo integration test passed: version contract is consistent");
      '

deploy_local:
  stage: deploy
  tags: [gmo021-client]
  rules:
    - if: "$CI_COMMIT_TAG"
      when: manual
      allow_failure: false
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: manual
      allow_failure: false
    - when: never
  before_script:
    - |
      set -eu
      rm -rf "$APP_SRC"
      mkdir -p "$APP_SRC"
      git clone "$APP_GIT" "$APP_SRC"
      git -C "$APP_SRC" checkout --detach "$CI_COMMIT_SHA"
      mkdir -p "$DEPLOY_DIR/postgres" "$DEPLOY_DIR/uploads"
      chmod 700 "$DEPLOY_DIR" || true
  script:
    - |
      set -eu
      test -n "${REGISTRY_PASSWORD:-}"
      test -n "${POSTGRES_PASSWORD:-}"
      echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
      cd "$APP_SRC/deploy"
      export REGISTRY IMAGE_NAME IMAGE_TAG PUBLISH_PORT DEPLOY_DIR POSTGRES_USER POSTGRES_DB POSTGRES_PASSWORD
      docker compose pull
      docker compose up -d --remove-orphans
