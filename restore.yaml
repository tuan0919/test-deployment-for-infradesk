stages:
  - restore

variables:
  APP_GIT: git@github.com:tuan0919/test-deployment-for-infradesk.git
  APP_REF: main
  APP_SRC: ./source
  BACKUP_ROOT: /var/lib/test-deployment-for-infradesk/backups
  POSTGRES_USER: app
  POSTGRES_DB: app
  DEPLOY_DIR: /home/gmo021/deploy-folder
  REGISTRY: gmo021.cansportsvg.com:9443
  REGISTRY_USER: admin
  IMAGE_NAME: infradesk/test-deployment
  PUBLISH_PORT: "18080"

restore_runtime:
  stage: restore
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $BACKUP_ID"
      when: manual
      allow_failure: false
    - when: never
  before_script:
    - |
      set -eu
      test -n "${BACKUP_ID:-}"
      rm -rf "$APP_SRC"
      mkdir -p "$APP_SRC"
      git clone --branch "$APP_REF" "$APP_GIT" "$APP_SRC"
  script:
    - |
      set -eu
      test -n "${POSTGRES_PASSWORD:-}"
      test -n "${REGISTRY_PASSWORD:-}"
      cd "$APP_SRC/deploy"
      export DEPLOY_DIR BACKUP_ROOT BACKUP_ID POSTGRES_USER POSTGRES_DB POSTGRES_PASSWORD
      export REGISTRY IMAGE_NAME IMAGE_TAG PUBLISH_PORT
      echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
      chmod +x scripts/restore.sh
      ./scripts/restore.sh
      docker compose up -d --remove-orphans
