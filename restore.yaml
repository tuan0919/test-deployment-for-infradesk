stages:
  - restore

variables:
  APP_GIT: git@github.com:tuan0919/test-deployment-for-infradesk.git
  APP_SRC: ./source
  BACKUP_ROOT: /home/gmo021/deploy-folder/backups
  POSTGRES_USER: app
  POSTGRES_DB: app
  DEPLOY_DIR: /home/gmo021/deploy-folder
  REGISTRY: gmo021.cansportsvg.com:9443
  REGISTRY_USER: admin
  IMAGE_NAME: infradesk/test-deployment
  PUBLISH_PORT: "18080"
  ARTIFACT_API_BASE: ""
  BACKUP_ARTIFACT_ID: ""
  BACKUP_MANIFEST_SHA256: ""

restore_runtime:
  stage: restore
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $BACKUP_ARTIFACT_ID"
      when: manual
      allow_failure: false
    - when: never
  before_script:
    - |
      set -eu
      test -n "${BACKUP_ARTIFACT_ID:-}"
      rm -rf "$APP_SRC"
      mkdir -p "$APP_SRC"
      git clone "$APP_GIT" "$APP_SRC"
      git -C "$APP_SRC" checkout --detach "$CI_COMMIT_SHA"
  script:
    - |
      set -eu
      test -n "${POSTGRES_PASSWORD:-}"
      test -n "${REGISTRY_PASSWORD:-}"
      mkdir -p input
      MANIFEST_PATH="$PWD/input/backup-reference.json"
      export ARTIFACT_API_BASE BACKUP_ARTIFACT_ID BACKUP_MANIFEST_SHA256
      cd "$APP_SRC"
      chmod +x deploy/scripts/download-backup-manifest.sh deploy/scripts/restore.sh
      deploy/scripts/download-backup-manifest.sh "$MANIFEST_PATH"
      cd deploy
      export DEPLOY_DIR BACKUP_ROOT POSTGRES_USER POSTGRES_DB POSTGRES_PASSWORD
      export REGISTRY IMAGE_NAME IMAGE_TAG PUBLISH_PORT
      echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
      ./scripts/restore.sh "$MANIFEST_PATH"
      docker compose up -d --remove-orphans
